 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rock Paper Scissors Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Rock Paper Scissors</h1>

    <div class="score-board">
        <div class="score-box">
            <p>You</p>
            <span id="userScore">0</span>
        </div>
        <div class="score-box">
            <p>Bot</p>
            <span id="compScore">0</span>
        </div>
    </div>

    <div class="buttons">
        <button id="rock">✊</button>
        <button id="paper">✋</button>
        <button id="scissors">✌</button>
    </div>

    <h2 id="result">Choose your move</h2>

    <button id="reset" class="reset-btn">Reset Game</button>
</div>

<script src="first.js"></script>
</body>
</html>
